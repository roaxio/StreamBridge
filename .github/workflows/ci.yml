name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: lint-and-test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System packages (ffmpeg CLI for tests/fake_ezcam.py)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build
      - name: Lint
        run: ruff check .
      - name: Build sdist + wheel
        run: python -m build
      # Virtual devices (OBS Virtual Camera, VB-CABLE, BlackHole, v4l2loopback, PipeWire) are not
      # available on hosted runners; those tests skip themselves. Check them by hand before a release.
      - name: Test
        run: pytest -q -rs
